<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" role="img" aria-labelledby="title desc">
<title id="title">画像全体ではなく場所ごとに照合する</title>
<desc id="desc">4×4の正常画像と検査画像を示し、検査画像の2つの傷の位置に対応する異常マップの2位置が高くなる例。実際には各パッチ特徴を正常メモリバンクと比べる。</desc>
<defs><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#172233}.title{font-size:38px;font-weight:700}.head{font-size:28px;font-weight:700}.body{font-size:22px}.small{font-size:18px}.em{font-size:24px;font-weight:700}.arrow{stroke:#172233;stroke-width:3;fill:none;marker-end:url(#a)}.cell{stroke:#172233;stroke-width:2}</style><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#172233"/></marker></defs>
<rect width="1600" height="790" fill="#fff"/>
<text x="70" y="85" class="title">異常は画像全体ではなく、場所ごとに見つける</text>
<text x="70" y="130" class="body">各位置のパッチ特徴を正常の特徴と比べ、距離を元の位置へ戻す</text>
<text x="235" y="230" text-anchor="middle" class="head">正常画像の見た目</text>
<text x="690" y="230" text-anchor="middle" class="head">検査画像の見た目</text>
