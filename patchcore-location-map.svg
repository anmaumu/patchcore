<text x="690" y="600" text-anchor="middle" class="body">オレンジの2か所に傷</text>
<text x="1365" y="600" text-anchor="middle" class="body">同じ2か所の距離が大きい</text>
<path d="M70 648 H1530" stroke="#d7dde4" stroke-width="2"/>
<text x="800" y="698" text-anchor="middle" class="em">場所ごとの距離を並べると、異常の位置が見える</text>
<text x="800" y="744" text-anchor="middle" class="small">※ 4×4は説明用。実際は正常画像のパッチ特徴を集めたメモリバンクと比較し、例では28×28位置を使う。</text>
