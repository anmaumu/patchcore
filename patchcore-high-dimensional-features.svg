<path d="M385 452 H450" class="arrow"/>
<rect x="465" y="385" width="170" height="135" rx="8" class="soft"/>
<text x="550" y="443" text-anchor="middle" class="head">CNN</text>
<text x="550" y="483" text-anchor="middle" class="small">中間層を使う</text>
<path d="M650 452 H700" class="arrow"/>

<rect x="715" y="355" width="36" height="36" class="cell"/>
