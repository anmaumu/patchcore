<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
<title id="title">CNNは各位置から高次元のパッチ特徴を抽出する</title>
<desc id="desc">入力画像をCNNに通すと多数のチャネルを持つ特徴マップが得られ、同じ空間位置のチャネル値を1本にまとめると高次元のパッチ特徴ベクトルになる。講義例では1536次元、位置は28×28で784本。</desc>
<defs><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#172233}.title{font-size:39px;font-weight:700}.head{font-size:27px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.em{font-size:24px;font-weight:700}.box{fill:#fff;stroke:#172233;stroke-width:2.5}.soft{fill:#f4f6f8;stroke:#172233;stroke-width:2.5}.cell{fill:#fff;stroke:#172233;stroke-width:1.7}.selected{fill:#ed7d31;stroke:#172233;stroke-width:1.7}.arrow{stroke:#172233;stroke-width:2.7;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#172233"/></marker></defs>
<rect width="1800" height="900" fill="#fff"/>
<text x="70" y="88" class="title">CNNは各位置から高次元の特徴を抽出する</text>
<text x="70" y="132" class="body">1か所の見た目を、たくさんの数値を並べた1本のベクトルで表す</text>
<text x="228" y="230" text-anchor="middle" class="head">入力画像</text>
<text x="978" y="230" text-anchor="middle" class="head">多チャネルの特徴マップ</text>
<text x="1550" y="230" text-anchor="middle" class="head">パッチ特徴量</text>

<rect x="90" y="315" width="55" height="55" class="cell"/>
