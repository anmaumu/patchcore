<text x="1127" y="535" text-anchor="middle" class="small">チャネル …</text>
<text x="980" y="590" text-anchor="middle" class="body">同じ位置に、チャネルごとの値がある</text>
<text x="980" y="630" text-anchor="middle" class="small">図の3枚は模式図。実際には多数のチャネル。</text>
<path d="M1220 452 H1290" class="arrow"/>
<rect x="1305" y="320" width="445" height="300" rx="9" class="box"/>
<text x="1528" y="368" text-anchor="middle" class="body">同じ位置の値を1列にまとめる</text>
<rect x="1370" y="397" width="318" height="44" fill="#fff1e8" stroke="#ed7d31" stroke-width="2"/>
<text x="1529" y="427" text-anchor="middle" class="body">layer2：512個の値</text>
<text x="1529" y="475" text-anchor="middle" class="head">＋</text>
<rect x="1370" y="499" width="318" height="44" fill="#fff1e8" stroke="#ed7d31" stroke-width="2"/>
<text x="1529" y="529" text-anchor="middle" class="body">layer3：1024個の値</text>
<text x="1528" y="585" text-anchor="middle" class="em">= 1536次元のベクトル</text>
<path d="M70 704 H1730" stroke="#d7dde4" stroke-width="2"/>
<text x="900" y="759" text-anchor="middle" class="em">28×28の各位置に1本ずつ → 1画像あたり784本</text>
<text x="900" y="812" text-anchor="middle" class="small">※ 数値はこの講義の構成例。layer3の位置を合わせて結合し、必要に応じて次元を調整する。</text>
<text x="900" y="847" text-anchor="middle" class="small">図のグリッドは説明用で、実際の特徴マップの大きさとは異なる。</text>
</svg>
