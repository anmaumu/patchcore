<title id="title">Greedy k-center：最も遠い正常点を代表に追加する</title>
<desc id="desc">最初に正常特徴を1点選び、選択済み代表からの最短距離が最大となる正常点を追加し、距離を更新して繰り返す3段階の図。</desc>
