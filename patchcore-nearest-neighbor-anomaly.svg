<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">最近傍距離がパッチの異常度になる</title>
<desc id="desc">正常パッチ特徴を灰色の点群で示し、検査パッチが正常点群の近くなら最近傍距離が短く異常度が低く、遠ければ距離が長く異常度が高いことを示す。さらに正常校正データの最大最近傍距離を基準とする任意の正規化を示す。</desc>
<defs><style>
text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#172233}.title{font-size:39px;font-weight:700}.head{font-size:28px;font-weight:700}.body{font-size:22px}.small{font-size:18px}.em{font-size:24px;font-weight:700}.panel{fill:#fff;stroke:#172233;stroke-width:2.5}.normal{fill:#dce1e6;stroke:#172233;stroke-width:1.8}.near{fill:#fff;stroke:#285d85;stroke-width:4}.far{fill:#ed7d31;stroke:#172233;stroke-width:2.5}.short{stroke:#285d85;stroke-width:3;stroke-dasharray:6 5}.long{stroke:#ed7d31;stroke-width:3;stroke-dasharray:8 6}
</style></defs>
<rect width="1600" height="850" fill="#fff"/>
<text x="70" y="86" class="title">最近傍距離が、そのパッチの異常度になる</text>
<text x="70" y="128" class="body">検査パッチから、メモリバンク内で最も近い正常特徴までの距離を測る</text>

<rect x="70" y="205" width="900" height="485" rx="10" class="panel"/>
<text x="110" y="252" class="head">特徴空間の模式図</text>
<text x="110" y="286" class="small">灰色の点：メモリバンクにある正常パッチ特徴</text>
<path d="M686 451 L704 523" stroke="#455a70" stroke-width="3" stroke-dasharray="3 5" fill="none"/>
<g class="normal">
<circle cx="280" cy="402" r="9"/><circle cx="315" cy="356" r="9"/><circle cx="336" cy="440" r="9"/><circle cx="365" cy="385" r="9"/><circle cx="392" cy="473" r="9"/><circle cx="414" cy="345" r="9"/><circle cx="438" cy="410" r="9"/><circle cx="466" cy="488" r="9"/><circle cx="485" cy="365" r="9"/><circle cx="512" cy="434" r="9"/><circle cx="535" cy="515" r="9"/><circle cx="557" cy="389" r="9"/><circle cx="578" cy="462" r="9"/><circle cx="610" cy="424" r="9"/><circle cx="634" cy="505" r="9"/><circle cx="658" cy="378" r="9"/><circle cx="686" cy="451" r="9"/><circle cx="704" cy="523" r="9"/><circle cx="362" cy="537" r="9"/><circle cx="442" cy="553" r="9"/><circle cx="553" cy="559" r="9"/>
</g>

<circle cx="724" cy="435" r="14" class="near"/>
<path d="M696 447 L711 440" class="short"/>
<text x="755" y="392" class="body">検査パッチ q₁</text>
<path d="M748 395 L731 421" stroke="#285d85" stroke-width="2" fill="none"/>
<text x="755" y="473" class="small">最近傍距離が短い</text>

<circle cx="863" cy="607" r="15" class="far"/>
<path d="M716 529 L849 601" class="long"/>
<text x="772" y="535" class="body">検査パッチ q₂</text>
<text x="743" y="647" class="small">最近傍距離が長い</text>
<path d="M110 627 H160" stroke="#455a70" stroke-width="3" stroke-dasharray="3 5"/>
<text x="175" y="635" class="small">正常内の最大最近傍距離（自己一致を除く）</text>

<rect x="1050" y="256" width="470" height="155" rx="9" fill="#fff" stroke="#285d85" stroke-width="2.5"/>
<circle cx="1097" cy="308" r="12" class="near"/>
<text x="1130" y="319" class="head">近い → 異常度が低い</text>
<text x="1090" y="368" class="body">似た正常パッチが見つかる</text>

<rect x="1050" y="477" width="470" height="155" rx="9" fill="#fff1e8" stroke="#ed7d31" stroke-width="2.5"/>
<circle cx="1097" cy="529" r="12" class="far"/>
<text x="1130" y="540" class="head">遠い → 異常度が高い</text>
<text x="1090" y="589" class="body">似た正常パッチが見つからない</text>

<path d="M70 725 H1530" stroke="#d7dde4" stroke-width="2"/>
<text x="70" y="771" class="em">追加の正規化（任意）</text>
<rect x="70" y="792" width="610" height="155" rx="9" class="panel"/>
<text x="105" y="836" class="head">正常データから基準を求める</text>
<text x="105" y="881" class="body">最近傍距離の例：0.4、0.8、1.0</text>
<text x="105" y="922" class="em">正常内の最大距離 = 1.0</text>
<rect x="730" y="792" width="800" height="155" rx="9" class="panel"/>
<text x="765" y="836" class="head">検査パッチの距離 ÷ 正常内の最大距離</text>
<text x="765" y="881" class="body">q₁：0.2 ÷ 1.0 = 0.2 （正常に近い）</text>
<text x="765" y="922" class="body">q₂：2.7 ÷ 1.0 = 2.7 （正常の最大より遠い）</text>
<text x="800" y="995" text-anchor="middle" class="small">※ 正規化は標準PatchCoreに追加する処理。基準には別の正常データを使うか、自己一致を除いて距離を計算する。</text>
<text x="800" y="1027" text-anchor="middle" class="small">点の配置と数値は説明用。正規化した値は1を超えることがある。</text>
</svg>
